// AirPi: classic AirPlay (ALAC) -> FiiO QX11, bit-perfect (full sample reference: /etc/shairport-sync.conf.sample)
general = {
  name = "AirPi";
  service_type = "classic";   // AirPlay 1: every sender must send lossless ALAC 44.1/16 (AirPlay 2 lets Apple Music send AAC)
  output_backend = "alsa";
  interpolation = "basic";          // a correction inserts/drops 1 sample; the rest of the packet stays bit-perfect
  drift_tolerance_in_seconds = 0.010; // single room: ignore sync drift under 10 ms (default 2 ms)
};

alsa = {
  output_device = "hw:QX11";     // direct to the DAC, no ALSA plug/resampling
  mixer_control_name = "PCM";    // AirPlay volume -> DAC hardware volume; samples stay untouched
  output_rate = "auto";          // match the incoming stream rate
  output_format = "auto";
};

metadata = {
  enabled = "yes";               // track info from the sender
  include_cover_art = "yes";     // cover art too
  pipe_name = "/tmp/shairport-sync-metadata";
};
